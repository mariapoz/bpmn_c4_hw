<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="860" viewBox="0 0 1140 860" font-family="DejaVu Sans, Arial, sans-serif" role="img" aria-labelledby="diagram-title">
  <title id="diagram-title">Как сервис ранжирования оценивает записи</title>
