  <text x="36" y="39" font-size="16" fill="#0d615c" text-anchor="start" font-weight="bold">C4  ·  Уровень 3  /  Components</text>
  <text x="36" y="82" font-size="31" fill="#173445" text-anchor="start" font-weight="bold">Как сервис ранжирования оценивает записи</text>
  <rect x="40" y="108" width="1060" height="650" rx="8" fill="#f6f9fa" stroke="#9cb1b8" />
  <text x="56" y="134" font-size="16" fill="#415d6b" text-anchor="start" font-weight="bold">Сервис ранжирования  ·  Python / ONNX Runtime</text>
