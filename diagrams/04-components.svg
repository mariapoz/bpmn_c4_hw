  <polygon points="773,654 784.0,649.7 784.0,658.3" fill="#415d6b" />
  <polyline points="363,654 63,654 63,266 82.5,266" fill="none" stroke="#415d6b" stroke-width="2" stroke-linejoin="round" />
  <polygon points="82.5,266 71.5,270.3 71.5,261.7" fill="#415d6b" />
  <g id="api">
    <title>Обработчик запроса · Принимает текст и кандидатов · от Координатора выбора</title>
    <rect x="82.5" y="210.5" width="365" height="95" rx="6" fill="#0d615c" stroke="#084b48" stroke-width="1.6" />
    <text x="265" y="242.0" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">Обработчик запроса</text>
    <text x="265" y="264.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="normal">Принимает текст и кандидатов</text>
    <text x="265" y="286.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="normal">от Координатора выбора</text>
  </g>
  <g id="feat">
    <title>Построитель признаков · Сопоставляет текст с названиями · и исполнителями из каталога</title>
    <rect x="673.0" y="210.5" width="364" height="95" rx="6" fill="#deefed" stroke="#477a78" stroke-width="1.6" />
    <text x="855" y="242.0" font-size="18" fill="#173445" text-anchor="middle" font-weight="bold">Построитель признаков</text>
    <text x="855" y="264.0" font-size="15" fill="#173445" text-anchor="middle" font-weight="normal">Сопоставляет текст с названиями</text>
    <text x="855" y="286.0" font-size="15" fill="#173445" text-anchor="middle" font-weight="normal">и исполнителями из каталога</text>
  </g>
  <g id="ver">
    <title>Загрузчик версии · Читает активную версию реестра · и кэширует модель с её схемой</title>
    <rect x="82.5" y="420.5" width="365" height="95" rx="6" fill="#deefed" stroke="#477a78" stroke-width="1.6" />
    <text x="265" y="452.0" font-size="18" fill="#173445" text-anchor="middle" font-weight="bold">Загрузчик версии</text>
    <text x="265" y="474.0" font-size="15" fill="#173445" text-anchor="middle" font-weight="normal">Читает активную версию реестра</text>
    <text x="265" y="496.0" font-size="15" fill="#173445" text-anchor="middle" font-weight="normal">и кэширует модель с её схемой</text>
  </g>
  <g id="calc">
    <title>Вычислитель оценок · Выполняет модель ONNX · для каждой записи</title>
    <rect x="673.0" y="420.5" width="364" height="95" rx="6" fill="#deefed" stroke="#477a78" stroke-width="1.6" />
    <text x="855" y="452.0" font-size="18" fill="#173445" text-anchor="middle" font-weight="bold">Вычислитель оценок</text>
    <text x="855" y="474.0" font-size="15" fill="#173445" text-anchor="middle" font-weight="normal">Выполняет модель ONNX</text>
    <text x="855" y="496.0" font-size="15" fill="#173445" text-anchor="middle" font-weight="normal">для каждой записи</text>
  </g>
  <g id="out">
    <title>Формирователь ответа · Сортирует пары (track_id, оценка), · добавляет версию модели</title>
    <rect x="363.0" y="606.5" width="410" height="95" rx="6" fill="#deefed" stroke="#477a78" stroke-width="1.6" />
    <text x="568" y="638.0" font-size="18" fill="#173445" text-anchor="middle" font-weight="bold">Формирователь ответа</text>
    <text x="568" y="660.0" font-size="15" fill="#173445" text-anchor="middle" font-weight="normal">Сортирует пары (track_id, оценка),</text>
    <text x="568" y="682.0" font-size="15" fill="#173445" text-anchor="middle" font-weight="normal">добавляет версию модели</text>
  </g>
  <text x="561" y="238" font-size="14" fill="#415d6b" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Текст и метаданные</text>
