  <text x="593" y="294" font-size="14" fill="#415d6b" text-anchor="middle" font-weight="normal">Схема признаков</text>
  <text x="877" y="365" font-size="14" fill="#415d6b" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Векторы и ID</text>
  <text x="877" y="365" font-size="14" fill="#415d6b" text-anchor="middle" font-weight="normal">Векторы и ID</text>
  <text x="561" y="483" font-size="14" fill="#415d6b" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Модель и версия</text>
  <text x="561" y="483" font-size="14" fill="#415d6b" text-anchor="middle" font-weight="normal">Модель и версия</text>
  <text x="913" y="580" font-size="14" fill="#415d6b" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">ID, оценки, версия</text>
  <text x="913" y="580" font-size="14" fill="#415d6b" text-anchor="middle" font-weight="normal">ID, оценки, версия</text>
  <text x="211" y="654" font-size="14" fill="#415d6b" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Ответ координатору через API</text>
  <text x="211" y="654" font-size="14" fill="#415d6b" text-anchor="middle" font-weight="normal">Ответ координатору через API</text>
  <text x="42" y="804" font-size="14" fill="#415d6b" text-anchor="start" font-weight="normal">Вход и выход соответствуют задаче BPMN «Вызвать сервис ранжирования». Решение о запуске остаётся у координатора.</text>
