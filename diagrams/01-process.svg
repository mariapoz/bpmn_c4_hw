  <text x="35" y="1460" font-size="14" fill="#415d6b" text-anchor="start" font-weight="normal">Ромб — исключающий шлюз. Тонкий круг — начало, жирный круг — конец. Стрелки задают порядок задач.</text>
  <text x="35" y="1485" font-size="14" fill="#415d6b" text-anchor="start" font-weight="normal">¹ При недоступной модели варианты берутся из каталога. Отмена, молчание или неясный ответ завершают попытку.</text>
